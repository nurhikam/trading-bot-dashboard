name: desk

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desk
  cancel-in-progress: false

jobs:
  run-desk:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet ccxt==4.5.75 pandas numpy

      - name: Run desk pass
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 ci_run.py

      - name: Commit and push (race-safe)
        run: |
          git config user.name "desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TS=$(date -u "+%Y-%m-%d %H:%M UTC")
          MSG="data: candle $TS"
          ok=0
          for i in 1 2 3 4 5; do
            git fetch origin main -q
            # move branch to remote tip, keep our regenerated files staged
            git reset --soft origin/main
            git add -A
            # CI may only write data/ and paper/ — restore everything else to remote tip
            # so a stale checkout can never clobber newer engine/UI commits
            git checkout origin/main -- . ':(exclude)data' ':(exclude)paper'
            git add -A
            if git diff --cached --quiet; then echo "nothing to commit"; ok=1; break; fi
            LAST=$(git log -1 --pretty=%s origin/main)
            if [[ "$LAST" == data:* ]]; then
              EXPECT=$(git rev-parse origin/main)
              if git commit --amend -m "$MSG" --quiet && \
                 git push --force-with-lease=refs/heads/main:"$EXPECT" origin main --quiet; then ok=1; break; fi
            else
              if git commit -m "$MSG" --quiet && \
                 git push origin main --quiet; then ok=1; break; fi
            fi
            sleep 5
          done
          exit $((1-ok))
